plugins {
    alias(libs.plugins.android.application)
    id("com.google.gms.google-services")
    id("com.google.firebase.crashlytics")
}

android {
    namespace 'com.example.nofomo'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.example.nofomo"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // Firebase BoM - מנהל את גרסאות כל ספריות Firebase
    implementation platform("com.google.firebase:firebase-bom:34.14.0")

    // Firebase Analytics - מעקב אחר אירועים ומסכים
    implementation "com.google.firebase:firebase-analytics"

    // Firebase Crashlytics - ניטור קריסות ושגיאות
    implementation "com.google.firebase:firebase-crashlytics"

    // Firebase Firestore - מסד הנתונים בענן
    implementation "com.google.firebase:firebase-firestore"

    // Firebase Authentication - התחברות משתמשים
    implementation "com.google.firebase:firebase-auth"

    // Google Sign In - התחברות באמצעות חשבון גוגל
    implementation "com.google.android.gms:play-services-auth:21.2.0"

    // CircleImageView - ספריית צד שלישי להצגת תמונת פרופיל עגולה
    implementation "de.hdodenhof:circleimageview:3.1.0"
}